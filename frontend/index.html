<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>K3 · Proof-of-Silence Gate</title><style>
:root{color-scheme:dark;font:15px system-ui;--bg:#09111f;--card:#111d31;--ink:#e8f0ff;--muted:#92a4bf;--cyan:#32d6c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#153055,var(--bg) 45%);color:var(--ink)}main{max-width:1180px;margin:auto;padding:32px}header,.metrics{display:flex;justify-content:space-between;gap:16px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0}.card{background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid #29415e;border-radius:14px;padding:20px}.metric b{display:block;font-size:30px;margin-top:7px}.muted{color:var(--muted)}button{border:0;border-radius:9px;padding:12px 20px;font-weight:800;cursor:pointer}.stop{background:#ff4862;color:white}.verify{background:var(--cyan);color:#06201e}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #263a54}code{font-size:12px;color:#9cebdd}.pill{padding:4px 8px;border-radius:99px;background:#263a54}#status.valid{color:#55e69f}#status.bad{color:#ff7588}@media(max-width:750px){.metrics{grid-template-columns:1fr 1fr}.scroll{overflow:auto}header{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><div><div class="muted">NEON AI · HUMAN OVERSIGHT</div><h1>K3 Proof-of-Silence™</h1><span id="health" class="muted">łączenie…</span></div><button class="stop" id="stop">■ STOP</button></header>
<section class="metrics"><div class="card metric"><span class="muted">Decyzje</span><b id="total">0</b></div><div class="card metric"><span class="muted">ACT NOW</span><b id="act">0</b></div><div class="card metric"><span class="muted">Wstrzymane</span><b id="held">0</b></div><div class="card metric"><span class="muted">Błędy</span><b id="errors">0</b></div></section>
<section class="card"><header><div><h2>Łańcuch audytowy</h2><span id="status" class="muted">niezweryfikowany</span></div><button class="verify" id="verify">Weryfikuj</button></header><div class="scroll"><table><thead><tr><th>Czas</th><th>Agent</th><th>Werdykt</th><th>Hash</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const API=globalThis.API_BASE||'http://localhost:8000';let records=[],publicKey='';
async function load(){try{const [h,c]=await Promise.all([fetch(API+'/healthz').then(r=>r.json()),fetch(API+'/v1/audit/chain?limit=1000').then(r=>r.json())]);records=c.records;publicKey=c.public_key;health.textContent=`${h.mode.toUpperCase()} · ${h.stopped?'STOP':'AKTYWNY'}`;total.textContent=c.total;act.textContent=records.filter(r=>r.verdict==='ACT NOW').length;held.textContent=records.filter(r=>['WAIT','SILENCE','REJECT'].includes(r.verdict)).length;rows.innerHTML=records.slice().reverse().map(r=>`<tr><td>${new Date(r.timestamp).toLocaleString()}</td><td>${esc(r.metadata?.agent_id||'—')}</td><td><span class="pill">${esc(r.verdict)}</span></td><td><code>${r.record_hash.slice(0,16)}…</code></td></tr>`).join('')}catch(e){errors.textContent=+errors.textContent+1;health.textContent='API OFFLINE'}}
function esc(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}stop.onclick=async()=>{if(confirm('Zatrzymać wszystkie nowe operacje?')){await fetch(API+'/v1/control/stop',{method:'POST'});load()}};verify.onclick=async()=>{const r=await fetch(API+'/v1/audit/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({records,public_key:publicKey})}).then(r=>r.json());status.textContent=r.status;status.className=r.valid?'valid':'bad'};load();setInterval(load,10000);
</script></body></html>
